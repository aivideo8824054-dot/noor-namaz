name: Build Noor Namaz V3 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          echo "Using SDK Manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Noor Namaz V3 Project
        run: |
          unzip -o "Noor-Namaz-Updated-Project-V3.zip" -d .

      - name: Check Project Files
        run: |
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Noor Namaz APK
        run: |
          gradle :app:assembleDebug

      - name: Upload Noor Namaz APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Namaz-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
